<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/@picocss/pico@latest/css/pico.min.css">
    <title>Hannah's Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<header>
  <h1>My Blog</h1>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main id="contact-page">
  <h2>Contact Me</h2>

  <form name="contact" data-netlify="true">

    <label for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="Your name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Your email" required>

    <label for="reason">Reason for contact</label>
    <select id="reason" name="reason">
      <option value="hi">Saying hi</option>
      <option value="contractor">Looking for a contractor</option>
      <option value="interview">Interested in an interview</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5" placeholder="Your message here"></textarea>

    <button type="submit">Submit</button>
  </form>
</main>


</body>
</html>
